# UseAgent on Coolify.
#
# Adapted from compose.local.yaml for Coolify's bridge-network deployment. The
# differences are deliberate and minimal:
#
#   1. Services `expose` their ports instead of publishing them on the host, so
#      Coolify's proxy can route to the containers over the compose network
#      without colliding with host ports. The frontend and gateway carry the
#      public domains via the application's docker_compose_domains setting.
#   2. Every secret is read from the application environment (Coolify
#      interpolates `${...}` and also injects `env_file: ['.env']`), so nothing
#      sensitive is committed.
#   3. The backend image build stages the native runtime archive from the public
#      GitHub release; upstream only stages it in CI before `docker build`, and
#      the Dockerfile refuses to build without it.
#
# Everything else (Postgres + pgvector, the three services, healthchecks and
# volumes) mirrors the upstream local-parity stack.

name: useagent

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: useagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d useagent"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 60s
    volumes:
      - useagent-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:?set RELEASE_COMMIT}
    image: useagent-backend:${RELEASE_COMMIT:?set RELEASE_COMMIT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: "3201"
      USEAGENT_BIND_HOST: 0.0.0.0
      USEAGENT_DEV_MODE: "false"
      REQUIRE_SINGLE_BACKEND: "true"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      USEAGENT_OPERATOR_SECRET: ${USEAGENT_OPERATOR_SECRET:?set USEAGENT_OPERATOR_SECRET}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?set GATEWAY_PUBLIC_URL}
      PROVIDER_GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
      PROVIDER_GATEWAY_SECRET: ${PROVIDER_GATEWAY_SECRET:?set PROVIDER_GATEWAY_SECRET}
      TOOL_GATEWAY_SECRET: ${TOOL_GATEWAY_SECRET:?set TOOL_GATEWAY_SECRET}
      CODEX_APP_SERVER_HOME_ROOT: /var/lib/useagent/codex-app-server
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-daytona}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-us}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-skynet-agent-v17}
      CUBE_API_URL: ${CUBE_API_URL:-}
      CUBE_API_KEY: ${CUBE_API_KEY:-}
      CUBE_TEMPLATE_ID: ${CUBE_TEMPLATE_ID:-}
      CUBE_SANDBOX_DOMAIN: ${CUBE_SANDBOX_DOMAIN:-cube.app}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    # TEMP diagnostic: hold the container open after a crash so the Coolify
    # log endpoint can return the backend's stdout/stderr.
    command: ["sh", "-c", "bun run src/index.ts; echo '=== BACKEND PROCESS EXITED rc='$?'; sleep 3600"]
    expose:
      - "3201"
    volumes:
      - useagent-artifacts:/app/backend/.artifacts
      - useagent-runs:/app/backend/.runs
      - useagent-slack-uploads:/app/backend/.slack-uploads
      - useagent-pi-runtime:/opt/useagent/pi-runtime
      - useagent-codex-app-server:/var/lib/useagent/codex-app-server
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:?set RELEASE_COMMIT}
    image: useagent-gateway:${RELEASE_COMMIT:?set RELEASE_COMMIT}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.GATEWAY_PORT||'3202')+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    environment:
      NODE_ENV: production
      GATEWAY_PORT: "3202"
      USEAGENT_BIND_HOST: 0.0.0.0
      USEAGENT_DEV_MODE: "false"
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:?set GATEWAY_DATABASE_URL}
      PROVIDER_GATEWAY_SECRET: ${PROVIDER_GATEWAY_SECRET:?set PROVIDER_GATEWAY_SECRET}
      TOOL_GATEWAY_SECRET: ${TOOL_GATEWAY_SECRET:?set TOOL_GATEWAY_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      USEAGENT_API_ORIGIN: http://backend:3201
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?set GATEWAY_PUBLIC_URL}
      PROVIDER_GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-daytona}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-us}
      CUBE_API_URL: ${CUBE_API_URL:-}
      CUBE_API_KEY: ${CUBE_API_KEY:-}
      CUBE_TEMPLATE_ID: ${CUBE_TEMPLATE_ID:-}
      CUBE_SANDBOX_DOMAIN: ${CUBE_SANDBOX_DOMAIN:-cube.app}
    expose:
      - "3202"
    volumes:
      - useagent-artifacts:/app/backend/.artifacts
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        RELEASE_COMMIT: ${RELEASE_COMMIT:?set RELEASE_COMMIT}
    image: useagent-frontend:${RELEASE_COMMIT:?set RELEASE_COMMIT}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'3400')+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3400"
      USEAGENT_API_ORIGIN: http://backend:3201
      NEXT_PUBLIC_USEAGENT_RELEASE_COMMIT: ${RELEASE_COMMIT:?set RELEASE_COMMIT}
    expose:
      - "3400"
    restart: unless-stopped

volumes:
  useagent-artifacts:
  useagent-codex-app-server:
  useagent-pi-runtime:
  useagent-postgres:
  useagent-runs:
  useagent-slack-uploads:
